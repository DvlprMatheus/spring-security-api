volumes:
  postgres-spring-security-data:
  
services:
  app:
    container_name: spring-security-app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
        POSTGRES_PASSWORD: postgres
        POSTGRES_USER: postgres
        POSTGRES_DB: spring-security-db
        POSTGRES_HOSTNAME: postgres
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
  postgres:
    container_name: spring-security-db
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres-spring-security-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: spring-security-db
    ports:
      - "5432:5432"
networks:
  app-network:
    driver: bridge